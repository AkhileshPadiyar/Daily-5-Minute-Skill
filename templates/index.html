<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily 5-Minute Skill</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white shadow-lg rounded-xl p-8 max-w-lg w-full text-center">
        <h1 class="text-2xl font-bold mb-4">🧠 Daily 5-Minute Skill</h1>
        <h2 class="text-xl font-semibold mb-2">{{ skill.title }}</h2>
        <p class="mb-4">{{ skill.description }}</p>
        
        <!-- Embed YouTube video directly here -->
        <div class="relative" style="padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; position: relative;">
            {% if skill.video_id %}
                <iframe src="https://www.youtube.com/embed/{{ skill.video_id }}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe>
            {% else %}
                <p>Video unavailable</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
